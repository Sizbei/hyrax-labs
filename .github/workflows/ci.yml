name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Three independent jobs, one per service. They run in parallel.
jobs:
  backend-jvm:
    name: backend-jvm (Kotlin + Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend-jvm
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('services/backend-jvm/**/*.gradle.kts', 'services/backend-jvm/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build + test
        run: ./gradlew build --no-daemon --stacktrace

  ingestion-pipeline:
    name: ingestion-pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion-pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (editable + dev extras)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Smoke-run the CLI over fixtures
        run: hyrax-ingest --fetcher soup --output /tmp/catalog.json && test -s /tmp/catalog.json

  metrics-dashboard:
    name: metrics-dashboard (React + D3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/metrics-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/metrics-dashboard/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
