name: Deploy dashboard

# Builds the metrics dashboard as a static SPA (no backend) and publishes it to
# GitHub Pages. The live dataset is generated in-browser from the same
# deterministic generator the server uses — synthetic data, identical numbers.

on:
  push:
    branches: [main]
    paths:
      - "services/metrics-dashboard/**"
      - "services/ingestion-pipeline/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on a new push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/metrics-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate asset seed from the ingestion pipeline
        working-directory: ${{ github.workspace }}/services/ingestion-pipeline
        run: |
          pip install -e .
          hyrax-ingest --fetcher soup \
            --output /tmp/catalog.json \
            --asset-seed "$GITHUB_WORKSPACE/services/metrics-dashboard/public/assets-seed.json"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/metrics-dashboard/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Build (static, GitHub Pages base path)
        env:
          VITE_STATIC: "1"
          BASE_PATH: "/hyrax-labs/"
        run: npm run build
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: services/metrics-dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
