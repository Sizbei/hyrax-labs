[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyrax-analytics"
version = "0.1.0"
description = "Django + DRF + MongoDB analytics service for catalog-asset engagement events on the Hyrax materials platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hyrax Labs" }]
keywords = ["django", "drf", "mongodb", "analytics", "engagement", "materials"]

dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "pymongo>=4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "mongomock>=4.1",
    "pytest-cov>=5.0",
]

[tool.setuptools]
# Flat-layout project: ship the two Django packages explicitly.
packages = ["analytics", "events"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "analytics.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["analytics", "events"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "manage.py"]
