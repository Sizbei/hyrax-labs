apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources live in the hyrax-labs namespace (set explicitly per object,
# and enforced here so any stray object is also placed correctly).
namespace: hyrax-labs

commonLabels:
  app.kubernetes.io/part-of: hyrax-labs
  app.kubernetes.io/managed-by: kustomize

resources:
  # Namespace + shared config first.
  - namespace.yaml
  - config.yaml
  - secret.yaml
  # Backing services.
  - postgres.yaml
  - redis.yaml
  - mongodb.yaml
  - kafka.yaml
  # Application services.
  - backend-jvm.yaml
  - catalog-api-go.yaml
  - analytics-py.yaml
  - metrics-dashboard.yaml
  # Batch.
  - ingestion-pipeline.yaml
